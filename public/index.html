<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/xterm.css">
<style>
  :root { --bg: #16181d; --panel: #1e2128; --line: #2c313a; --text: #d7dae0; --dim: #8b93a1; --sel: #2a2f3a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #side { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  #project { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #project img { flex: none; width: 18px; height: 18px; }
  #project nav { display: flex; flex-wrap: wrap; gap: 2px 12px; min-width: 0; }
  #project a { color: var(--dim); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #project a:hover { color: var(--text); }
  #project a[aria-current] { color: var(--text); font-weight: 600; }
  #project b { margin-left: 5px; padding: 0 5px; border-radius: 8px; background: #f0a23c; color: var(--bg); font-size: 11px; }
  #add { display: block; width: 100%; padding: 8px 12px; background: none; color: var(--dim); border: none; border-bottom: 1px solid var(--line); font: inherit; text-align: left; cursor: pointer; }
  #add[hidden] { display: none; }
  #add:hover, #add:focus-visible { color: var(--text); background: var(--sel); outline: none; }
  .row { padding: 10px 12px 10px 9px; border-left: 3px solid var(--c); border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover, .row.sel { background: var(--sel); }
  .row.drag { opacity: .4; }
  .branch { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; color: var(--dim); font-size: 12px; }
  .meta a { color: #7fb4e8; text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .meta a.down { color: var(--dim); }
  .meta a:not([href]) { color: inherit; text-decoration: none; }
  .meta a.down:not([href]) { color: var(--dim); cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555c68; }
  .idle .dot { background: #8b93a1; }
  .unknown .dot { background: #8b93a1; animation: pulse 1s ease-in-out infinite; }
  .working .dot { background: #5aa9f0; animation: pulse 1s ease-in-out infinite; }
  .background .dot { background: #5aa9f0; animation: pulse 3s ease-in-out infinite; }
  .waiting .dot { background: #f0a23c; }
  .done .dot { background: #4fbf7a; }
  .waiting .state, .done .state { color: var(--text); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .unknown .dot, .working .dot, .background .dot { animation: none; } }
  .state { flex: 1; }
  #notify { margin: 10px 12px; padding: 5px 10px; background: none; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font: inherit; }
  #notify:hover { color: var(--text); }
  #new { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #new input { width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  #new div { margin-top: 4px; color: var(--dim); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #new div.err { color: #e8857f; }
  #main { flex: 1; min-width: 0; padding: 6px 0 0 8px; }
  .term { height: 100%; }
  #empty { color: var(--dim); padding: 24px; }
</style>
</head>
<body>
<div id="side"><div id="project"><img src="/icon.svg" alt=""><nav aria-label="Projects"></nav></div><div id="rows"></div><form id="new" hidden><input aria-label="New worktree name" placeholder="new worktree name" autocomplete="off" spellcheck="false"><div></div></form><button id="add">+ New worktree</button><button id="notify" hidden>Enable notifications</button></div>
<div id="main"><div id="empty">Pick a worktree.</div></div>
<script type="module">
import { Terminal } from "/xterm.mjs";
import { FitAddon } from "/addon-fit.mjs";
import { WebLinksAddon } from "/addon-web-links.mjs";

const COLORS = ["#8c2a2a", "#2a5e8c", "#2a8c57", "#8c6d2a"];
const mainEl = document.getElementById("main");
const params = new URLSearchParams(location.search);
let project = params.get("p");
let selected = params.get("s");
const query = () => `?p=${encodeURIComponent(project)}${selected ? `&s=${encodeURIComponent(selected)}` : ""}`;
const terms = new Map(); // session → { term, fit, ws, el }, kept attached so switching is instant
const current = () => terms.get(selected);

function attach(session) {
  const el = document.createElement("div");
  el.className = "term";
  mainEl.append(el);
  const term = new Terminal({ fontFamily: "'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace", fontSize: 14, lineHeight: 1.15,
    scrollback: 0, theme: { background: "#16181d" } }); // scrollback is tmux's
  const fit = new FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon());
  term.parser.registerOscHandler(52, (data) => {
    const b64 = data.slice(data.indexOf(";") + 1);
    if (b64 !== "?") navigator.clipboard.writeText(new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))));
    return true;
  });
  // Ctrl+V: leave it to the browser so its paste event delivers text (xterm would send a
  // bare ^V, which only claude understands). The paste listener below covers images.
  // F11/F12 likewise stay with the browser (fullscreen, devtools).
  term.attachCustomKeyEventHandler((e) => {
    if (e.key === "F11" || e.key === "F12") return false;
    return !(e.type === "keydown" && e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "v");
  });
  term.open(el);
  fit.fit();
  const ws = new WebSocket(`ws://${location.host}/pty?s=${encodeURIComponent(session)}&cols=${term.cols}&rows=${term.rows}`);
  const send = (m) => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m)); };
  ws.onmessage = (e) => term.write(e.data);
  ws.onclose = () => term.write("\r\n\x1b[2m[detached — click the row to reattach]\x1b[0m\r\n");
  term.onData((d) => send({ t: "i", d }));
  term.onResize(({ cols, rows }) => send({ t: "r", cols, rows }));
  const t = { term, fit, ws, el, send };
  terms.set(session, t);
  return t;
}

function open(session) {
  selected = session;
  history.replaceState(null, "", query());
  document.getElementById("empty").hidden = true;
  let t = terms.get(session);
  if (t && t.ws.readyState > WebSocket.OPEN) { // detached: start over
    t.term.dispose();
    t.el.remove();
    t = null;
  }
  t ??= attach(session);
  for (const other of terms.values()) other.el.hidden = other !== t;
  t.fit.fit(); // the window may have been resized while this one was hidden
  t.term.focus();
  refresh();
}

const LABEL = { off: "no chat", unknown: "running", idle: "idle", working: "working", background: "background tasks", waiting: "needs you", done: "done" };
const prev = new Map();
let rendered;
let dragging; // the row being dragged to a new place; the list is not rebuilt meanwhile
const watching = (session) => session === selected && document.hasFocus();
const post = (path) => fetch(path, { method: "POST" });

function notify(w) {
  if (Notification.permission !== "granted") return;
  const n = new Notification(`${w.branch} — ${LABEL[w.state]}`, { tag: w.session });
  n.onclick = () => { window.focus(); open(w.session); };
}

async function refresh() {
  const data = await (await fetch(`/api/sessions?p=${encodeURIComponent(project ?? "")}`)).json();
  const list = data.sessions;
  project = data.project;
  for (const w of list) {
    // a finished turn stays `done` until looked at
    if (w.state === "done" && watching(w.session)) {
      post(`/api/status?s=${encodeURIComponent(w.session)}&state=idle&if=done`);
      w.state = "idle";
    }
    const was = prev.get(w.session);
    if (was && was !== w.state && ["waiting", "done"].includes(w.state) && !watching(w.session)) notify(w);
    prev.set(w.session, w.state);
  }
  const pending = list.filter((w) => ["waiting", "done"].includes(w.state)).length;
  document.title = `${pending ? `(${pending}) ` : ""}${project} — Hub`;
  // rebuilding restarts the pulse animation, so only on change
  const key = JSON.stringify([data, selected]);
  if (key === rendered || dragging) return;
  rendered = key;
  // one project per tab: plain links, so another project can open beside this one;
  // the others show how many of their chats need attention
  projectNav.replaceChildren(...data.projects.map((p) => {
    const a = document.createElement("a");
    a.href = `?p=${encodeURIComponent(p.name)}`;
    a.textContent = p.name;
    if (p.name === project) {
      a.setAttribute("aria-current", "page");
    } else if (p.pending) {
      const n = document.createElement("b");
      n.textContent = p.pending;
      n.title = `${p.pending} waiting or done`;
      a.append(n);
    }
    return a;
  }));
  rows.replaceChildren(...list.map((w) => {
    const row = document.createElement("div");
    row.className = `row ${w.state}${w.session === selected ? " sel" : ""}`;
    row.style.setProperty("--c", w.main ? "#555c68" : COLORS[(w.port ?? w.index) % 4]);
    row.innerHTML = `<div class="branch"></div><div class="meta"><span class="dot"></span><span class="state"></span><a target="_blank"></a></div>`;
    row.querySelector(".branch").textContent = w.branch;
    row.querySelector(".state").textContent = LABEL[w.state];
    row.title = w.dir;
    row.dataset.session = w.session;
    row.draggable = true;
    const a = row.querySelector("a");
    a.draggable = false; // a drag that starts on the link moves the row too
    a.textContent = `:${w.port}`;
    if (w.url) a.href = w.url;
    if (!w.port) {
      a.hidden = true;
    } else if (w.dev) {
      a.title = "dev server is up";
      a.onclick = (e) => e.stopPropagation();
    } else {
      a.className = "down";
      a.title = w.devCommand ? "dev server is down — click to start it" : "nothing is listening on this port";
      a.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (w.alive) post(`/api/dev?s=${encodeURIComponent(w.session)}`);
        else open(w.session); // a new session starts its dev server
      };
    }
    row.onclick = () => open(w.session);
    return row;
  }));
}

const rows = document.getElementById("rows");
const projectNav = document.querySelector("#project nav");
const notifyBtn = document.getElementById("notify");
notifyBtn.hidden = Notification.permission !== "default";
notifyBtn.onclick = async () => { notifyBtn.hidden = (await Notification.requestPermission()) !== "default"; };
window.addEventListener("focus", refresh);

// Drag a row to reorder: it moves live under the pointer, and the drop saves the order
// on the server (per project), so every tab shows the same one.
rows.addEventListener("dragstart", (e) => {
  dragging = e.target.closest(".row");
  dragging.classList.add("drag");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragging.dataset.session); // Firefox needs some data
});
rows.addEventListener("dragover", (e) => {
  if (!dragging) return;
  e.preventDefault();
  const over = e.target.closest(".row");
  if (!over || over === dragging) return;
  const box = over.getBoundingClientRect();
  if (e.clientY < box.top + box.height / 2) over.before(dragging);
  else over.after(dragging);
});
rows.addEventListener("drop", (e) => e.preventDefault());
rows.addEventListener("dragend", async (e) => {
  if (!dragging) return;
  // dropped outside the list or Esc: nothing is saved and the rebuild puts the row back
  if (e.dataTransfer.dropEffect !== "none") {
    const body = new URLSearchParams([["p", project], ...[...rows.children].map((r) => ["s", r.dataset.session])]);
    await fetch("/api/order", { method: "POST", body }).catch(() => {});
  }
  dragging = null;
  rendered = null;
  refresh();
});

// "+ New worktree" under the list turns into a name field; Enter creates and opens it.
const addBtn = document.getElementById("add");
const newForm = document.getElementById("new");
const newName = newForm.querySelector("input");
const newNote = newForm.querySelector("div");
const note = (text, err = false) => { newNote.textContent = text; newNote.className = err ? "err" : ""; };
const naming = (on) => { newForm.hidden = !on; addBtn.hidden = on; };
addBtn.onclick = () => {
  naming(true);
  note("");
  newName.focus();
};
newName.onkeydown = (e) => { if (e.key === "Escape" && !newName.disabled) naming(false); };
newForm.onsubmit = async (e) => {
  e.preventDefault();
  const name = newName.value.trim();
  if (!name || newName.disabled) return;
  newName.disabled = true;
  note("creating…");
  const res = await fetch("/api/worktrees", { method: "POST", body: new URLSearchParams({ p: project, name }) }).catch((err) => err);
  newName.disabled = false;
  if (!res.ok) {
    note(res.ok === false ? await res.text() : String(res), true);
    return newName.focus();
  }
  newName.value = "";
  naming(false);
  open(await res.text());
};

// Right-click copies a shift+drag selection; the browser menu never shows (its Copy
// can't see terminal text). A plain drag is tmux's selection, copied on release via OSC 52.
mainEl.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const term = current()?.term;
  if (!term?.hasSelection()) return;
  navigator.clipboard.writeText(term.getSelection());
  term.clearSelection();
}, true);

// no text on the clipboard (an image): pass ^V through so claude reads the clipboard itself
mainEl.addEventListener("paste", (e) => {
  if (!e.clipboardData.getData("text/plain")) current()?.send({ t: "i", d: "\x16" });
}, true);

new ResizeObserver(() => current()?.fit.fit()).observe(mainEl);
await refresh();
if (selected) open(selected);
setInterval(refresh, 1500);
</script>
</body>
</html>
