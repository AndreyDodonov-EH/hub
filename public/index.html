<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/xterm.css">
<style>
  :root { --bg: #16181d; --panel: #1e2128; --line: #2c313a; --text: #d7dae0; --dim: #8b93a1; --sel: #2a2f3a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #side { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  #project { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #project img { width: 18px; height: 18px; }
  #project select { flex: 1; min-width: 0; background: none; color: var(--text); border: none; font: inherit; font-weight: 600; cursor: pointer; }
  #project option { background: var(--panel); }
  .row { padding: 10px 12px 10px 9px; border-left: 3px solid var(--c); border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover, .row.sel { background: var(--sel); }
  .branch { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; color: var(--dim); font-size: 12px; }
  .meta a { color: #7fb4e8; text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .meta a.down { color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555c68; }
  .idle .dot { background: #8b93a1; }
  .working .dot { background: #5aa9f0; animation: pulse 1s ease-in-out infinite; }
  .waiting .dot { background: #f0a23c; }
  .done .dot { background: #4fbf7a; }
  .waiting .state, .done .state { color: var(--text); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .working .dot { animation: none; } }
  .state { flex: 1; }
  #notify { margin: 10px 12px; padding: 5px 10px; background: none; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font: inherit; }
  #notify:hover { color: var(--text); }
  #main { flex: 1; min-width: 0; padding: 6px 0 0 8px; }
  .term { height: 100%; }
  #empty { color: var(--dim); padding: 24px; }
</style>
</head>
<body>
<div id="side"><div id="project"><img src="/icon.svg" alt=""><select aria-label="Project"></select></div><div id="rows"></div><button id="notify" hidden>Enable notifications</button></div>
<div id="main"><div id="empty">Pick a worktree.</div></div>
<script type="module">
import { Terminal } from "/xterm.mjs";
import { FitAddon } from "/addon-fit.mjs";
import { WebLinksAddon } from "/addon-web-links.mjs";

const COLORS = ["#8c2a2a", "#2a5e8c", "#2a8c57", "#8c6d2a"];
const mainEl = document.getElementById("main");
const params = new URLSearchParams(location.search);
let project = params.get("p");
let selected = params.get("s");
const query = () => `?p=${encodeURIComponent(project)}${selected ? `&s=${encodeURIComponent(selected)}` : ""}`;
const terms = new Map(); // session → { term, fit, ws, el }, kept attached so switching is instant
const current = () => terms.get(selected);

function attach(session) {
  const el = document.createElement("div");
  el.className = "term";
  mainEl.append(el);
  const term = new Terminal({ fontFamily: "'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace", fontSize: 14, lineHeight: 1.15,
    scrollback: 0, theme: { background: "#16181d" } }); // scrollback is tmux's
  const fit = new FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon());
  term.parser.registerOscHandler(52, (data) => {
    const b64 = data.slice(data.indexOf(";") + 1);
    if (b64 !== "?") navigator.clipboard.writeText(new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))));
    return true;
  });
  // Ctrl+V: leave it to the browser so its paste event delivers text (xterm would send a
  // bare ^V, which only claude understands). The paste listener below covers images.
  // F11/F12 likewise stay with the browser (fullscreen, devtools).
  term.attachCustomKeyEventHandler((e) => {
    if (e.key === "F11" || e.key === "F12") return false;
    return !(e.type === "keydown" && e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "v");
  });
  term.open(el);
  fit.fit();
  const ws = new WebSocket(`ws://${location.host}/pty?s=${encodeURIComponent(session)}&cols=${term.cols}&rows=${term.rows}`);
  const send = (m) => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m)); };
  ws.onmessage = (e) => term.write(e.data);
  ws.onclose = () => term.write("\r\n\x1b[2m[detached — click the row to reattach]\x1b[0m\r\n");
  term.onData((d) => send({ t: "i", d }));
  term.onResize(({ cols, rows }) => send({ t: "r", cols, rows }));
  const t = { term, fit, ws, el, send };
  terms.set(session, t);
  return t;
}

function open(session) {
  selected = session;
  history.replaceState(null, "", query());
  document.getElementById("empty").hidden = true;
  let t = terms.get(session);
  if (t && t.ws.readyState > WebSocket.OPEN) { // detached: start over
    t.term.dispose();
    t.el.remove();
    t = null;
  }
  t ??= attach(session);
  for (const other of terms.values()) other.el.hidden = other !== t;
  t.fit.fit(); // the window may have been resized while this one was hidden
  t.term.focus();
  refresh();
}

const LABEL = { off: "no chat", unknown: "running", idle: "idle", working: "working", waiting: "needs you", done: "done" };
const prev = new Map();
let rendered;
const watching = (session) => session === selected && document.hasFocus();
const post = (path) => fetch(path, { method: "POST" });

function notify(w) {
  if (Notification.permission !== "granted") return;
  const n = new Notification(`${w.branch} — ${LABEL[w.state]}`, { tag: w.session });
  n.onclick = () => { window.focus(); open(w.session); };
}

async function refresh() {
  const data = await (await fetch(`/api/sessions?p=${encodeURIComponent(project ?? "")}`)).json();
  const list = data.sessions;
  project = data.project;
  for (const w of list) {
    // a finished turn stays `done` until looked at
    if (w.state === "done" && watching(w.session)) {
      post(`/api/status?s=${encodeURIComponent(w.session)}&state=idle&if=done`);
      w.state = "idle";
    }
    const was = prev.get(w.session);
    if (was && was !== w.state && ["waiting", "done"].includes(w.state) && !watching(w.session)) notify(w);
    prev.set(w.session, w.state);
  }
  const pending = list.filter((w) => ["waiting", "done"].includes(w.state)).length;
  document.title = `${pending ? `(${pending}) ` : ""}${project} — Hub`;
  // rebuilding restarts the pulse animation, so only on change
  const key = JSON.stringify([data, selected]);
  if (key === rendered) return;
  rendered = key;
  // one project per tab: switching navigates, so each tab keeps its own terminal
  projectSel.replaceChildren(...data.projects.map((name) => new Option(name, name, false, name === project)));
  rows.replaceChildren(...list.map((w, i) => {
    const row = document.createElement("div");
    row.className = `row ${w.state}${w.session === selected ? " sel" : ""}`;
    row.style.setProperty("--c", w.main ? "#555c68" : COLORS[(w.port ?? i) % 4]);
    row.innerHTML = `<div class="branch"></div><div class="meta"><span class="dot"></span><span class="state"></span><a target="_blank"></a></div>`;
    row.querySelector(".branch").textContent = w.branch;
    row.querySelector(".state").textContent = LABEL[w.state];
    row.title = w.dir;
    const a = row.querySelector("a");
    a.textContent = `:${w.port}`;
    a.href = w.url;
    if (!w.port) {
      a.hidden = true;
    } else if (w.dev) {
      a.title = "dev server is up";
      a.onclick = (e) => e.stopPropagation();
    } else {
      a.className = "down";
      a.title = w.devCommand ? "dev server is down — click to start it" : "nothing is listening on this port";
      a.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (w.alive) post(`/api/dev?s=${encodeURIComponent(w.session)}`);
        else open(w.session); // a new session starts its dev server
      };
    }
    row.onclick = () => open(w.session);
    return row;
  }));
}

const rows = document.getElementById("rows");
const projectSel = document.querySelector("#project select");
projectSel.onchange = () => { location.search = `?p=${encodeURIComponent(projectSel.value)}`; };
const notifyBtn = document.getElementById("notify");
notifyBtn.hidden = Notification.permission !== "default";
notifyBtn.onclick = async () => { notifyBtn.hidden = (await Notification.requestPermission()) !== "default"; };
window.addEventListener("focus", refresh);

// Right-click copies a shift+drag selection; the browser menu never shows (its Copy
// can't see terminal text). A plain drag is tmux's selection, copied on release via OSC 52.
mainEl.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const term = current()?.term;
  if (!term?.hasSelection()) return;
  navigator.clipboard.writeText(term.getSelection());
  term.clearSelection();
}, true);

// no text on the clipboard (an image): pass ^V through so claude reads the clipboard itself
mainEl.addEventListener("paste", (e) => {
  if (!e.clipboardData.getData("text/plain")) current()?.send({ t: "i", d: "\x16" });
}, true);

new ResizeObserver(() => current()?.fit.fit()).observe(mainEl);
await refresh();
if (selected) open(selected);
setInterval(refresh, 1500);
</script>
</body>
</html>
