# Hub's private tmux server (socket `hub`) — the user's own tmux config is untouched.
set -g status off
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g default-terminal "xterm-256color"
set -g focus-events on
set -g set-clipboard on
# right-click belongs to the page (copy), not tmux's pane menu
unbind -n MouseDown3Pane
